[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-bloom"
dynamic = ["version"]
description = "Huawei-style bloom theme for Claude Code and Codex CLI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["huawei", "claude-code", "codex", "terminal", "pty", "theme"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Terminals",
]
dependencies = []

[project.scripts]
huawei-bloom = "agent_theme.cli:main"

[project.urls]
Repository = "https://github.com/hza2002/huawei-bloom"

[tool.setuptools.dynamic]
version = {attr = "agent_theme.__version__"}

[tool.setuptools.packages.find]
include = ["agent_theme*"]

[tool.setuptools.package-data]
agent_theme = ["assets/*.json", "LICENSE"]
