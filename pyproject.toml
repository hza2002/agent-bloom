[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bloom"
dynamic = ["version"]
description = "Animated terminal themes for Claude Code and Codex CLI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["claude-code", "codex", "terminal", "animation", "pty", "theme", "apple", "huawei"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Terminals",
]
dependencies = []

[project.scripts]
agent-bloom = "agent_theme.cli:main"

[project.urls]
Repository = "https://github.com/hza2002/agent-bloom"

[tool.setuptools.dynamic]
version = {attr = "agent_theme.__version__"}

[tool.setuptools.packages.find]
include = ["agent_theme*"]

[tool.setuptools.package-data]
agent_theme = ["assets/*.json", "themes/assets/*.json", "themes/assets/*.svg", "themes/assets/*.txt", "LICENSE"]
