<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple · Motion studies</title>
<style>
:root{color-scheme:dark;--bg:#101113;--panel:#17181b;--line:#303136;--ink:#eeeef0;--muted:#999ba4;--accent:#d7f2be}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button,select{color:inherit;background:transparent;cursor:pointer}button{border:0;touch-action:manipulation}button:active{transform:scale(.97)}:focus-visible{outline:2px solid var(--accent);outline-offset:5px}a{color:inherit}main{max-width:1550px;margin:auto;padding:36px 44px 24px}.eyebrow{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.14em;color:var(--muted)}.eyebrow svg{width:16px;height:20px;fill:var(--ink)}.eyebrow span:last-child{margin-left:auto;letter-spacing:.03em}header{padding:26px 0 32px;display:flex;align-items:end;gap:30px}h1{font-size:clamp(30px,4vw,52px);font-weight:550;line-height:1.2;margin:0}header p{font-size:14px;color:var(--muted);line-height:1.8;margin:0 0 3px auto;max-width:340px}.workspace{display:grid;grid-template-columns:275px minmax(0,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}aside{border-right:1px solid var(--line);padding:24px 24px 24px 0}.section-label{font-size:11px;letter-spacing:.1em;color:var(--muted);margin:0 0 20px}.choice{width:100%;text-align:left;padding:19px 15px;margin:0 0 8px;border:1px solid transparent;border-radius:8px;display:block}.choice[aria-pressed=true]{background:#222427;border-color:#46494e}.choice .number{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.choice .number i{font-style:normal;opacity:0;color:var(--accent)}.choice[aria-pressed=true] .number i{opacity:1}.choice strong{display:block;font-size:21px;font-weight:500;margin:10px 0 6px;letter-spacing:-.025em}.choice small{font-size:12px;color:var(--muted);line-height:1.6}.swatches{display:flex;gap:3px;margin-top:16px}.swatches b{width:21px;height:3px;border-radius:2px}.note{font-size:12px;line-height:1.8;color:var(--muted);padding:18px 12px 0;margin-top:10px;border-top:1px solid var(--line)}.note b{color:var(--ink);font-weight:500}.player{min-width:0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 24px;border-bottom:1px solid var(--line);font-size:12px}.switch{display:flex;background:#222427;padding:3px;border-radius:6px;gap:2px}.switch button{padding:8px 10px;border-radius:4px;min-height:34px;color:var(--muted)}.switch button[aria-pressed=true]{background:#42444a;color:var(--ink)}.stage{height:clamp(390px,48vw,570px);position:relative;background:#08090b}.stage canvas{width:100%;height:100%;display:block}.stage-badge{position:absolute;top:20px;left:24px;font:10px ui-monospace,monospace;letter-spacing:.1em;color:#858891;pointer-events:none}.stage-label{position:absolute;right:24px;bottom:18px;font:10px ui-monospace,monospace;letter-spacing:.08em;color:#858891;pointer-events:none}.transport{padding:18px 24px 22px;background:var(--panel)}.timeline{display:flex;gap:14px;align-items:center}.timeline output{font:11px ui-monospace,monospace;color:var(--muted);min-width:78px;text-align:right}input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer;min-height:24px}.actions{display:flex;align-items:center;gap:10px;margin-top:15px;flex-wrap:wrap}.primary{background:var(--ink);color:#151618;padding:11px 18px;border-radius:5px;font-size:12px;font-weight:600;min-height:42px}.secondary{border:1px solid #42444a;border-radius:5px;padding:10px 16px;font-size:12px;min-height:42px}.actions label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}.actions select{border:0;padding:8px;font-size:12px;background:var(--panel)}.actions .spacer{margin-left:auto}.choose{color:var(--accent);border-color:#546048}.details{display:grid;grid-template-columns:1.1fr 1.5fr 1fr;gap:30px;padding:25px 0}.details h2{font-size:12px;color:var(--muted);font-weight:400;margin:0 0 10px}.details p{font-size:13px;line-height:1.9;margin:0}.details .brand{font-size:23px;letter-spacing:-.025em;font-weight:500}.details .brand small{font-size:12px;display:block;color:var(--muted);letter-spacing:0;margin-top:5px}footer{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:20px;line-height:1.8}#decision{color:var(--accent)}.skip{position:absolute;left:16px;top:-80px;background:var(--ink);color:#111;padding:10px;z-index:3}.skip:focus{top:16px}@media(hover:hover){.choice:hover{background:#202125}.secondary:hover{background:#292b30}}@media(max-width:900px){main{padding:24px}.workspace{grid-template-columns:215px minmax(0,1fr)}aside{padding-right:14px}.toolbar{padding:12px}.switch button{font-size:11px;padding:7px}.transport{padding:16px}.details{gap:20px}header p{max-width:250px;font-size:12px}}@media(max-width:650px){main{padding:22px 16px}.eyebrow span:last-child{font-size:9px}header{display:block;padding:24px 0}header p{max-width:none;margin-top:14px}.workspace{display:flex;flex-direction:column}aside{border-right:0;padding:16px 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.section-label,.note{display:none}.choice{padding:11px 8px;margin:0}.choice strong{font-size:14px;min-height:34px;line-height:1.25}.choice small{font-size:10px}.choice .number{font-size:9px}.swatches b{width:12px}.stage{height:420px}.toolbar{padding:12px 0}.switch button{padding:7px}.transport{padding:16px 10px}.actions{gap:7px}.primary,.secondary{padding:10px 12px}.details{grid-template-columns:1fr;gap:20px}.details h2{margin-bottom:5px}footer{flex-direction:column;gap:8px}}@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<a class="skip" href="#player">跳到动画播放器</a>
<main>
<div class="eyebrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="small-mark"/></svg><span>APPLE / MOTION STUDIES</span><span>主题实验 · 01—03</span></div>
<header><h1>Apple，三种开场。</h1><p>同一个经典轮廓，三种完全不同的能量。<br>播放、拖动，选出你想每天打开的那一种。</p></header>
<div class="workspace">
<aside aria-label="选择动画方案">
<p class="section-label">SELECT A DIRECTION</p>
<button class="choice" data-concept="spectrum" aria-pressed="true"><span class="number">01 / CLASSIC REBORN <i>●</i></span><strong>Spectrum</strong><small>六色重组 · 经典新生</small><span class="swatches"><b style="background:#65bb53"></b><b style="background:#f5d33e"></b><b style="background:#ef952a"></b><b style="background:#e14a4b"></b><b style="background:#a65ca6"></b><b style="background:#4ca9d6"></b></span></button>
<button class="choice" data-concept="silver" aria-pressed="false"><span class="number">02 / LIGHT INTO FORM <i>●</i></span><strong>Liquid silver</strong><small>液态银光 · 一体成形</small><span class="swatches"><b style="background:#f1eee8"></b><b style="background:#a7a9ae"></b><b style="background:#575b65"></b></span></button>
<button class="choice" data-concept="constellation" aria-pressed="false"><span class="number">03 / ORDER FROM LIGHT <i>●</i></span><strong>Constellation</strong><small>光点聚合 · 平滑定格</small><span class="swatches"><b style="background:#76afff"></b><b style="background:#cb93f5"></b><b style="background:#ffafcf"></b></span></button>
<div class="note"><b>先选动作，再定细节。</b><br>苹果使用统一的矢量轮廓。颜色、文字与闲置效果可以在选定方向后继续组合。</div>
</aside>
<section class="player" id="player" aria-label="动画预览">
<div class="toolbar"><div class="switch" aria-label="预览模式"><button id="smooth" aria-pressed="true">平滑原型</button><button id="cells" aria-pressed="false">字符格近似</button></div><div class="switch" aria-label="背景"><button id="dark" aria-pressed="true">深色</button><button id="light" aria-pressed="false">浅色</button></div></div>
<div class="stage"><canvas id="canvas" aria-label="Apple 主题动画预览"></canvas><span class="stage-badge" id="phase">01 / ASSEMBLY</span><span class="stage-label">APPLE · CLAUDE / CODEX</span></div>
<div class="transport"><div class="timeline"><input id="time" type="range" min="0" max="6" step="0.01" value="0" aria-label="动画时间"><output id="clock">0.00 / 6.00</output></div><div class="actions"><button class="primary" id="replay">↺ 重新播放</button><button class="secondary" id="play">暂停</button><label><input type="checkbox" id="loop"> 循环</label><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select><span class="spacer"></span><button class="secondary choose" id="choose">选这个方向</button></div></div>
</section>
</div>
<section class="details" aria-label="方案说明"><div><h2>品牌文案</h2><p class="brand" id="copy"></p></div><div><h2>动作设计</h2><p id="description"></p></div><div><h2>迁移到终端</h2><p id="terminal"></p></div></section>
<footer><span id="decision" role="status" aria-live="polite">看完后告诉我：01、02 或 03，也可以混搭。</span><span>本地概念原型，非 Apple 官方作品。<a href="https://github.com/simple-icons/simple-icons/blob/develop/icons/apple.svg" target="_blank" rel="noreferrer">图标来源</a></span></footer>
</main>
<script>
const APPLE_PATH = 'M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701';
const path=new Path2D(APPLE_PATH);document.getElementById('small-mark').setAttribute('d',APPLE_PATH);
const concepts={
spectrum:{copy:'Think different.',sub:'APPLE / CLASSIC REIMAGINED',description:'六道色带从两侧交错进入，严丝合缝地拼成彩虹苹果。一束白光掠过，经典口号随之显现；最后留下完整、清晰的六色图案。',terminal:'适配度高。色带、分段入场和扫光都可直接转成字符格。',phase:['COLOR ASSEMBLY','SPECTRUM SWEEP','THINK DIFFERENT']},
silver:{copy:'hello.',sub:'APPLE / A NEW BEGINNING',description:'微弱轮廓先出现，银色液面向上填充主体与叶片。随后一束斜向高光扫过，显出金属切面；hello. 以柔和的节奏浮现。',terminal:'适配度高。保留轮廓与亮度层次，金属反射需减少色阶。',phase:['LIQUID FILL','SILVER LIGHT','HELLO']},
constellation:{copy:'One more thing.',sub:'APPLE / FROM LIGHT TO FORM',description:'散落的光点沿弧线汇聚，逐渐显露苹果形状。光点逐渐融入实体，平滑定格；收尾不再叠加轮廓亮光。',terminal:'需要简化。保留汇聚与实体成形；柔光和细粒子仅作视觉参考。',phase:['PARTICLE CONVERGENCE','FORM SETTLES','ONE MORE THING']}
};
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),surface=document.createElement('canvas'),g=surface.getContext('2d',{willReadFrequently:true});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let current=new URLSearchParams(location.search).get('concept');if(!concepts[current])current='spectrum';let t=reduced?6:0,playing=!reduced,light=false,pixel=false,last=0,width=0,height=0;
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3),smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
let seed=17;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const probe=document.createElement('canvas').getContext('2d');const dots=[];for(let y=0;y<24;y+=.46)for(let x=0;x<24;x+=.46)if(probe.isPointInPath(path,x,y))dots.push({x,y,a:rand()*Math.PI*2,r:1.1+rand()*1.8,delay:rand()*.45,size:.7+rand()*.7});
function selected(){document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.concept===current)));$('copy').textContent=concepts[current].copy;const small=document.createElement('small');small.textContent=concepts[current].sub;$('copy').append(small);$('description').textContent=concepts[current].description;$('terminal').textContent=concepts[current].terminal;}
function fit(){const r=canvas.getBoundingClientRect();width=r.width;height=r.height;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);surface.width=Math.round(width);surface.height=Math.round(height);draw();}
function logoTransform(fn){g.save();const s=Math.min(width*.47,height*.49,285),x=(width-s)/2,y=height*.12;g.translate(x,y);g.scale(s/24,s/24);fn(s);g.restore();return {s,x,y};}
function outline(color,alpha=1,line=.045){g.globalAlpha=alpha;g.strokeStyle=color;g.lineWidth=line;g.stroke(path);g.globalAlpha=1;}
function spectrum(){const colors=['#64b853','#f4cf3b','#ec9229','#dd4b49','#a057a0','#489ed3'];outline(light?'#b0ada3':'#444746',.8);g.save();g.clip(path);g.fillStyle=light?'#e4e0d6':'#111816';g.fillRect(0,0,24,24);for(let i=0;i<6;i++){const p=ease((t-.12-i*.17)/1.15);g.save();g.translate((i%2?1:-1)*(1-p)*32,0);g.fillStyle=colors[i];g.fillRect(-1,i*4,26,4.03);g.restore();}const sweep=clamp((t-1.45)/1.1);if(sweep>0&&sweep<1){g.save();g.translate(-16+sweep*60,0);g.rotate(.25);let grad=g.createLinearGradient(-3,0,3,0);grad.addColorStop(0,'#ffffff00');grad.addColorStop(.5,'#ffffffae');grad.addColorStop(1,'#ffffff00');g.fillStyle=grad;g.fillRect(-3,-20,6,70);g.restore();}g.restore();}
function silver(){outline(light?'#918e88':'#b0b9c9',smooth(t/.5)*.6,.045);g.save();g.clip(path);const fill=ease((t-.25)/1.8);const y=26-fill*27;let metal=g.createLinearGradient(0,0,25,20);[['0',light?'#333b49':'#6a7586'],['.25',light?'#777d86':'#edf0f5'],['.48',light?'#252b35':'#9aa6b9'],['.67',light?'#59616d':'#eff2f6'],['1',light?'#161b24':'#67778e']].forEach(([n,c])=>metal.addColorStop(+n,c));g.fillStyle=metal;g.fillRect(-1,y,27,30);if(fill<1){g.fillStyle=light?'#a6abb2':'#f8fbff';g.fillRect(-1,y,27,.16);}const p=clamp((t-1.3)/1.35);if(p>0&&p<1){g.save();g.translate(-15+p*56,0);g.rotate(-.38);const gleam=g.createLinearGradient(-4,0,4,0);gleam.addColorStop(0,'#ffffff00');gleam.addColorStop(.5,light?'#cdd4de99':'#ffffffed');gleam.addColorStop(1,'#ffffff00');g.fillStyle=gleam;g.fillRect(-4,-20,8,70);g.restore();}g.restore();}
function constellation(s){const base=smooth((t-1.35)/1.2);let grad=g.createLinearGradient(1,0,22,24);grad.addColorStop(0,light?'#5276c5':'#8cc5ff');grad.addColorStop(.5,light?'#8865b5':'#d5b2f2');grad.addColorStop(1,light?'#bd658c':'#ffb5d4');g.globalAlpha=base;g.fillStyle=grad;g.fill(path);g.globalAlpha=1;for(const d of dots){const p=ease((t-d.delay)/2.15),q=1-p;const angle=d.a+q*1.6;const x=d.x+Math.cos(angle)*d.r*25*q,y=d.y+Math.sin(angle)*d.r*22*q;g.globalAlpha=(1-base)*clamp(t*3);g.fillStyle=light?'#7c639f':(d.x<12?'#9fc7ff':'#e4b6ea');g.beginPath();g.arc(x,y,d.size*(24/s),0,Math.PI*2);g.fill();}g.globalAlpha=1;}
function draw(){if(!width)return;g.clearRect(0,0,width,height);g.fillStyle=light?'#f2f0eb':'#08090b';g.fillRect(0,0,width,height);const geometry=logoTransform(s=>{if(current==='spectrum')spectrum();else if(current==='silver')silver();else constellation(s);});const fade=smooth((t-1.9)/.75);const y=geometry.y+geometry.s+56;g.globalAlpha=fade;g.textAlign='center';g.fillStyle=light?'#25282d':'#e9e8e6';const fontSize=Math.min(width*.069,38);g.font=current==='silver'?`italic ${fontSize+15}px Georgia, serif`:`500 ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;g.fillText(concepts[current].copy,width/2,y+10*(1-fade));g.font='10px ui-monospace, Menlo, monospace';g.fillStyle=light?'#74757b':'#797e89';g.fillText(concepts[current].sub,width/2,y+37);g.globalAlpha=1;ctx.clearRect(0,0,width,height);if(!pixel){ctx.drawImage(surface,0,0,width,height);}else{ctx.fillStyle=light?'#f2f0eb':'#08090b';ctx.fillRect(0,0,width,height);const cellW=Math.max(4,width/110),cellH=cellW*2.12,data=g.getImageData(0,0,surface.width,surface.height).data;for(let yy=0;yy<height;yy+=cellH/4)for(let xx=0;xx<width;xx+=cellW/2){let sx=Math.min(surface.width-1,Math.floor(xx+cellW/4)),sy=Math.min(surface.height-1,Math.floor(yy+cellH/8)),i=(sy*surface.width+sx)*4;ctx.fillStyle=`rgb(${data[i]},${data[i+1]},${data[i+2]})`;ctx.fillRect(xx,yy,Math.ceil(cellW/2),Math.ceil(cellH/4));}}$('time').value=t;$('clock').textContent=t.toFixed(2)+' / 6.00';$('phase').textContent=concepts[current].phase[t<1.5?0:t<2.8?1:2];$('play').textContent=playing?'暂停':'播放';$('canvas').setAttribute('aria-label',`${current} 苹果动画，${t.toFixed(1)} 秒${pixel?'，字符格近似':''}`);}
function replay(){t=0;playing=true;last=performance.now();draw();}
document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.concept;selected();if(reduced){t=6;playing=false;draw();}else replay();try{history.replaceState(null,'','?concept='+current);}catch{}}));
$('replay').addEventListener('click',replay);$('play').addEventListener('click',()=>{if(t>=6)t=0;playing=!playing;last=performance.now();draw();});$('time').addEventListener('input',e=>{playing=false;t=+e.target.value;draw();});
function toggle(a,b,fn){$(a).addEventListener('click',()=>{fn(false);$(a).setAttribute('aria-pressed','true');$(b).setAttribute('aria-pressed','false');draw();});$(b).addEventListener('click',()=>{fn(true);$(a).setAttribute('aria-pressed','false');$(b).setAttribute('aria-pressed','true');draw();});}toggle('smooth','cells',v=>pixel=v);toggle('dark','light',v=>{light=v;});
$('choose').addEventListener('click',()=>{$('decision').textContent=`已选择 ${String(Object.keys(concepts).indexOf(current)+1).padStart(2,'0')} · ${document.querySelector(`[data-concept="${current}"] strong`).textContent}。在对话里告诉我，我们继续细化这个方向。`;});
function tick(now){if(!document.hidden&&playing){if(last)t+=Math.min((now-last)/1000,.1)*+$('speed').value;if(t>=6){if($('loop').checked)t%=6;else{t=6;playing=false;}}draw();}last=now;requestAnimationFrame(tick);}selected();new ResizeObserver(fit).observe(canvas);requestAnimationFrame(tick);
</script>
</body></html>
