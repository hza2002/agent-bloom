name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.12', '3.14']
        include:
          - os: macos-latest
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install terminal oracle (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install terminal oracle (macOS)
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux
      - run: tmux -V
      - run: python -m py_compile agent-bloom agent_theme/*.py
      - run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m venv /tmp/hb-wheel
      - run: /tmp/hb-wheel/bin/pip install dist/*.whl
      - run: /tmp/hb-wheel/bin/agent-bloom --version
      - run: /tmp/hb-wheel/bin/agent-bloom --list
      - name: Render from the installed wheel outside the checkout
        working-directory: /tmp
        run: |
          /tmp/hb-wheel/bin/python -I - <<'PY'
          from pathlib import Path
          import sys
          import agent_theme
          from agent_theme.cli import engine_check
          from agent_theme.apps import PROFILES
          from agent_theme.themes import THEME_NAMES, get_theme
          assert Path(agent_theme.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          for name in THEME_NAMES:
              for profile in PROFILES.values():
                  theme = get_theme(name)
                  for animation in theme.animations:
                      _, selected = theme.select_animation(animation.key)
                      checks = engine_check(profile, selected)
                      assert checks and all(passed for _, passed, _ in checks), checks
          PY
      - run: mkdir -p /tmp/hb-sdist && tar -xzf dist/*.tar.gz -C /tmp/hb-sdist --strip-components=1
      - run: cd /tmp/hb-sdist && python -m unittest discover -s tests -q
