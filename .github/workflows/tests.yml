name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.12', '3.14']
        include:
          - os: macos-latest
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile huawei-bloom agent_theme/*.py
      - run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m venv /tmp/hb-wheel
      - run: /tmp/hb-wheel/bin/pip install dist/*.whl
      - run: /tmp/hb-wheel/bin/huawei-bloom --version
      - run: /tmp/hb-wheel/bin/python -c "from agent_theme import art; assert art.BRANDS['claude'].key == 'claude'"
